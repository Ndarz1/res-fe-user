<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking - Eksplora</title>
    <link href="./src/css/output.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <header class="bg-white border-b border-gray-200 py-4 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-6 flex items-center gap-4">
        <a
          href="#"
          onclick="history.back(); return false;"
          class="p-2 hover:bg-gray-100 rounded-full transition"
        >
          <svg
            class="w-6 h-6 text-gray-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
        </a>
        <h1 class="text-xl font-bold">Konfirmasi Pemesanan</h1>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <form id="booking-form" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
          <div
            class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"
          >
            <div
              class="flex items-center gap-3 mb-6 border-b border-gray-100 pb-4"
            >
              <div
                class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm"
              >
                1
              </div>
              <h2 class="text-lg font-bold">Data Diri</h2>
            </div>

            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Nama Lengkap</label
                >
                <input
                  type="text"
                  name="full_name"
                  required
                  class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  placeholder="Sesuai KTP"
                />
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Email</label
                  >
                  <input
                    type="email"
                    name="email"
                    required
                    class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="email@contoh.com"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Nomor Telepon / WA</label
                  >
                  <input
                    type="tel"
                    name="phone"
                    required
                    class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="0812..."
                  />
                </div>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Catatan Tambahan (Opsional)</label
                >
                <textarea
                  name="notes"
                  rows="2"
                  class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  placeholder="Permintaan khusus..."
                ></textarea>
              </div>
            </div>
          </div>

          <div
            class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"
          >
            <div
              class="flex items-center gap-3 mb-6 border-b border-gray-100 pb-4"
            >
              <div
                class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm"
              >
                2
              </div>
              <h2 class="text-lg font-bold">Metode Pembayaran</h2>
            </div>

            <div class="space-y-3">
              <label
                class="flex items-center gap-4 p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition group"
              >
                <input
                  type="radio"
                  name="payment_method"
                  value="qris"
                  checked
                  class="w-5 h-5 text-blue-600 focus:ring-blue-500"
                />
                <div class="flex-grow">
                  <span class="block font-bold text-gray-900"
                    >QRIS Instant</span
                  >
                  <span class="text-sm text-gray-500"
                    >GoPay, OVO, Dana, ShopeePay</span
                  >
                </div>
              </label>

              <label
                class="flex items-center gap-4 p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition group"
              >
                <input
                  type="radio"
                  name="payment_method"
                  value="transfer"
                  class="w-5 h-5 text-blue-600 focus:ring-blue-500"
                />
                <div class="flex-grow">
                  <span class="block font-bold text-gray-900"
                    >Transfer Bank</span
                  >
                  <span class="text-sm text-gray-500"
                    >BCA, Mandiri, BRI, BNI</span
                  >
                </div>
              </label>
            </div>
          </div>
        </div>

        <div class="lg:col-span-1">
          <div
            class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-24"
          >
            <h2 class="text-lg font-bold mb-4 border-b border-gray-100 pb-4">
              Ringkasan Pesanan
            </h2>

            <div class="flex gap-4 mb-6">
              <img
                id="summary-img"
                src=""
                class="w-20 h-20 object-cover rounded-xl bg-gray-200 shadow-sm"
              />
              <div>
                <h3
                  id="summary-title"
                  class="font-bold text-gray-900 line-clamp-2 text-sm leading-snug"
                >
                  Memuat...
                </h3>
                <div class="flex items-center gap-1 mt-2 text-xs text-gray-500">
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                    ></path>
                  </svg>
                  <span id="summary-date">-</span>
                </div>
              </div>
            </div>

            <div class="space-y-3 mb-6 text-sm">
              <div class="flex justify-between">
                <span class="text-gray-500">Harga Tiket</span>
                <span id="summary-price" class="font-medium">Rp 0</span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-500">Jumlah Penumpang</span>
                <span id="summary-qty" class="font-medium">x0</span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-500">Pajak & Biaya Layanan</span>
                <span class="text-green-600 font-medium">Gratis</span>
              </div>
              <div
                class="border-t border-dashed border-gray-200 my-2 pt-4 flex justify-between items-center"
              >
                <span class="font-bold text-gray-900 text-base"
                  >Total Bayar</span
                >
                <span id="summary-total" class="text-xl font-bold text-blue-600"
                  >Rp 0</span
                >
              </div>
            </div>

            <button
              type="submit"
              class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all shadow-lg hover:shadow-blue-500/30 flex items-center justify-center gap-2"
            >
              <span>Bayar Sekarang</span>
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 8l4 4m0 0l-4 4m4-4H3"
                ></path>
              </svg>
            </button>

            <p class="text-center text-xs text-gray-400 mt-4">
              Dengan menekan tombol di atas, Anda menyetujui Syarat & Ketentuan
              Eksplora.
            </p>
          </div>
        </div>
      </form>
    </main>

    <script type="module">
      import { initBooking } from "./src/features/booking/booking.js";
      document.addEventListener("DOMContentLoaded", initBooking);
    </script>
  </body>
</html>
