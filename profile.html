<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Saya - Eksplora</title>

    <link href="../../src/css/output.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
              serif: ['"Playfair Display"', "serif"],
            },
            colors: {
              slate: { 850: "#1e293b", 900: "#0f172a" },
            },
          },
        },
      };
    </script>

    <style>
      .tab-active {
        background-color: #0f172a;
        color: white;
      }
      .tab-inactive {
        background-color: transparent;
        color: #64748b;
      }
      .tab-inactive:hover {
        background-color: #f1f5f9;
        color: #0f172a;
      }
    </style>
  </head>

  <body
    class="bg-slate-50 font-sans antialiased text-slate-900 min-h-screen flex flex-col"
  >
    <header
      class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <a
          href="/"
          class="group inline-flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-blue-900 transition-colors tracking-wide uppercase"
        >
          <svg
            class="w-4 h-4 transition-transform group-hover:-translate-x-1"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
          Kembali ke Beranda
        </a>
        <span class="font-serif font-bold text-lg text-slate-900"
          >Akun Saya</span
        >
      </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-6 py-12 w-full">
      <div class="flex flex-col lg:flex-row gap-12">
        <div class="w-full lg:w-1/3">
          <div
            class="bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-slate-100 overflow-hidden sticky top-24"
          >
            <div class="h-32 bg-slate-900 relative overflow-hidden">
              <div
                class="absolute inset-0 bg-gradient-to-br from-blue-900 to-slate-900 opacity-80"
              ></div>
              <div
                class="absolute -bottom-10 -right-10 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl"
              ></div>
              <div
                class="absolute top-10 left-10 w-20 h-20 bg-white/10 rounded-full blur-xl"
              ></div>
            </div>

            <div class="px-8 pb-8 text-center relative">
              <div class="relative -mt-16 mb-4 inline-block">
                <div class="p-1.5 bg-white rounded-full shadow-sm">
                  <img
                    id="profile-img-display"
                    src=""
                    class="w-28 h-28 rounded-full object-cover bg-slate-100 hidden"
                  />
                  <div
                    id="profile-initial-display"
                    class="w-28 h-28 bg-slate-100 rounded-full flex items-center justify-center"
                  >
                    <span class="text-4xl font-serif font-bold text-slate-400"
                      >U</span
                    >
                  </div>
                </div>
                <button
                  onclick="openEditModal()"
                  class="absolute bottom-1 right-1 p-2 bg-blue-900 text-white rounded-full hover:bg-blue-800 transition shadow-lg border-2 border-white"
                  title="Edit Foto"
                >
                  <svg
                    class="w-3 h-3"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
                    ></path>
                  </svg>
                </button>
              </div>

              <h2
                id="profile-name"
                class="text-2xl font-serif font-bold text-slate-900 mb-1"
              >
                ...
              </h2>
              <p
                id="profile-email"
                class="text-sm text-slate-500 font-medium mb-6"
              >
                ...
              </p>

              <div class="flex flex-col gap-3 border-t border-slate-100 pt-6">
                <div
                  class="flex items-center gap-3 text-sm text-slate-600 px-4 py-3 bg-slate-50 rounded-xl"
                >
                  <svg
                    class="w-5 h-5 text-slate-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                    ></path>
                  </svg>
                  <span id="profile-phone" class="font-mono">...</span>
                </div>
              </div>

              <button
                id="btn-logout-profile"
                class="w-full mt-6 py-3 border border-red-100 text-red-600 text-sm font-bold rounded-xl hover:bg-red-50 transition flex items-center justify-center gap-2"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                  ></path>
                </svg>
                Keluar Akun
              </button>
            </div>
          </div>
        </div>

        <div class="w-full lg:w-2/3">
          <div class="flex items-center justify-between mb-8">
            <h2 class="text-3xl font-serif font-bold text-slate-900">
              Tiket Perjalanan
            </h2>
          </div>

          <div class="flex gap-2 mb-8 overflow-x-auto pb-2 no-scrollbar">
            <button
              onclick="filterHistory('all')"
              id="tab-all"
              class="tab-active px-6 py-2.5 rounded-full text-sm font-bold transition whitespace-nowrap"
            >
              Semua
            </button>
            <button
              onclick="filterHistory('pending')"
              id="tab-pending"
              class="tab-inactive px-6 py-2.5 rounded-full text-sm font-bold transition whitespace-nowrap"
            >
              Menunggu Bayar
            </button>
            <button
              onclick="filterHistory('paid')"
              id="tab-paid"
              class="tab-inactive px-6 py-2.5 rounded-full text-sm font-bold transition whitespace-nowrap"
            >
              Selesai
            </button>
            <button
              onclick="filterHistory('cancelled')"
              id="tab-cancelled"
              class="tab-inactive px-6 py-2.5 rounded-full text-sm font-bold transition whitespace-nowrap"
            >
              Dibatalkan
            </button>
          </div>

          <div id="history-container" class="space-y-6 min-h-[400px]">
            <div class="animate-pulse space-y-4">
              <div class="h-40 bg-slate-200 rounded-2xl w-full"></div>
              <div class="h-40 bg-slate-200 rounded-2xl w-full"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div
      id="edit-modal"
      class="fixed inset-0 z-50 hidden transition-opacity duration-300"
    >
      <div
        class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"
        onclick="closeEditModal()"
      ></div>
      <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white p-8 rounded-3xl shadow-2xl transform transition-all scale-95 opacity-0 duration-300"
      >
        <div class="flex justify-between items-center mb-8">
          <h3 class="text-2xl font-serif font-bold text-slate-900">
            Ubah Profil
          </h3>
          <button
            onclick="closeEditModal()"
            class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition"
          >
            <svg
              class="w-4 h-4 text-slate-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <form id="edit-profile-form" class="space-y-6">
          <div class="flex justify-center mb-6">
            <label class="cursor-pointer group relative">
              <img
                id="preview-img"
                class="w-24 h-24 rounded-full object-cover border-4 border-slate-50 shadow-md"
                src=""
              />
              <div
                class="absolute inset-0 bg-slate-900/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition"
              >
                <svg
                  class="w-6 h-6 text-white"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
                  ></path>
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
                  ></path>
                </svg>
              </div>
              <input
                type="file"
                name="profile_image"
                class="hidden"
                accept="image/*"
                onchange="previewFile(this)"
              />
            </label>
          </div>

          <div>
            <label
              class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2"
              >Nama Lengkap</label
            >
            <input
              type="text"
              name="full_name"
              id="input-fullname"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-900 focus:ring-1 focus:ring-blue-900 outline-none text-slate-900 font-medium"
              required
            />
          </div>

          <div>
            <label
              class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2"
              >Nomor Telepon</label
            >
            <input
              type="text"
              name="phone"
              id="input-phone"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-900 focus:ring-1 focus:ring-blue-900 outline-none text-slate-900 font-medium"
            />
          </div>

          <button
            type="submit"
            class="w-full py-3.5 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition shadow-lg mt-4"
          >
            Simpan Perubahan
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="./src/features/profile/profile.js"></script>

    <script>
      function openEditModal() {
        const modal = document.getElementById("edit-modal");
        const panel = modal.querySelector("div:nth-child(2)");

        modal.classList.remove("hidden");
        setTimeout(() => {
          panel.classList.remove("scale-95", "opacity-0");
          panel.classList.add("scale-100", "opacity-100");
        }, 10);
      }

      function closeEditModal() {
        const modal = document.getElementById("edit-modal");
        const panel = modal.querySelector("div:nth-child(2)");

        panel.classList.remove("scale-100", "opacity-100");
        panel.classList.add("scale-95", "opacity-0");

        setTimeout(() => {
          modal.classList.add("hidden");
        }, 300);
      }

      function previewFile(input) {
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            document.getElementById("preview-img").src = e.target.result;
          };
          reader.readAsDataURL(input.files[0]);
        }
      }

      window.openEditModal = openEditModal;
      window.closeEditModal = closeEditModal;
      window.previewFile = previewFile;
    </script>
  </body>
</html>
