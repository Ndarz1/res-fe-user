<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selesaikan Pembayaran - Eksplora</title>

    <link href="../../css/output.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
              serif: ['"Playfair Display"', "serif"],
            },
            colors: {
              slate: { 850: "#1e293b", 900: "#0f172a" },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 md:p-6 font-sans"
  >
    <div
      class="max-w-4xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row"
    >
      <div
        class="w-full md:w-5/12 bg-slate-900 p-8 md:p-10 text-white relative overflow-hidden"
      >
        <div
          class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 rounded-full bg-blue-500/10 blur-3xl"
        ></div>
        <div
          class="absolute bottom-0 left-0 -ml-16 -mb-16 w-64 h-64 rounded-full bg-blue-500/10 blur-3xl"
        ></div>

        <div class="relative z-10 h-full flex flex-col">
          <div class="mb-8">
            <p class="text-slate-400 text-xs uppercase tracking-widest mb-1">
              Total Tagihan
            </p>
            <h1
              id="pay-amount"
              class="text-4xl font-serif font-medium text-white"
            >
              Rp ...
            </h1>
          </div>

          <div class="space-y-6 flex-grow">
            <div class="border-t border-white/10 pt-6">
              <p class="text-slate-400 text-xs uppercase tracking-widest mb-2">
                Kode Booking
              </p>
              <div class="flex items-center gap-3">
                <span
                  id="booking-code"
                  class="font-mono text-xl tracking-wider text-blue-200"
                  >...</span
                >
                <button
                  onclick="copyToClipboard('booking-code')"
                  class="text-white/40 hover:text-white transition-colors"
                  title="Salin Kode"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                    ></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="border-t border-white/10 pt-6 space-y-3">
              <div class="flex justify-between text-sm">
                <span class="text-slate-400">Wisata</span>
                <span
                  id="wisata-name"
                  class="font-medium text-right max-w-[150px] truncate"
                  >...</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-slate-400">Tanggal</span>
                <span id="visit-date" class="font-medium">...</span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-slate-400">Tiket</span>
                <span id="qty" class="font-medium">...</span>
              </div>
            </div>
          </div>

          <div class="mt-8 pt-6 border-t border-white/10 text-center">
            <p class="text-xs text-slate-500 mb-2">Butuh bantuan?</p>
            <a
              href="https://wa.me/6281234567890"
              target="_blank"
              class="inline-flex items-center gap-2 text-green-400 hover:text-green-300 text-sm font-medium transition-colors"
            >
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path
                  d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"
                />
              </svg>
              Hubungi Admin
            </a>
          </div>
        </div>
      </div>

      <div class="w-full md:w-7/12 p-8 md:p-12 relative">
        <div
          class="absolute top-6 right-6 flex items-center gap-2 bg-orange-50 text-orange-600 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm"
        >
          <svg
            class="w-4 h-4 animate-pulse"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
          <span id="countdown-timer">00:59:59</span>
        </div>

        <h2 class="text-2xl font-serif font-bold text-slate-900 mb-2">
          Instruksi Pembayaran
        </h2>
        <p class="text-slate-500 text-sm mb-8">
          Selesaikan pembayaran sebelum waktu habis.
        </p>

        <div id="payment-method-container" class="mb-8">
          <div class="animate-pulse flex flex-col gap-4">
            <div class="h-4 bg-slate-200 rounded w-1/4"></div>
            <div class="h-32 bg-slate-100 rounded-xl"></div>
          </div>
        </div>

        <div class="space-y-4">
          <button
            id="btn-confirm"
            class="w-full py-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg hover:shadow-slate-900/20 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              ></path>
            </svg>
            Saya Sudah Transfer
          </button>

          <button
            id="btn-cancel"
            class="w-full py-3 bg-white border border-slate-200 text-slate-500 hover:text-red-500 hover:border-red-100 font-medium rounded-xl transition-all"
          >
            Batalkan Pesanan
          </button>
        </div>

        <div class="mt-6 text-center">
          <a
            href="/"
            class="text-xs text-slate-400 hover:text-blue-900 transition-colors"
            >Kembali ke Beranda</a
          >
        </div>
      </div>
    </div>

    <div
      id="toast-notification"
      class="fixed top-5 right-5 z-50 transform transition-all duration-300 translate-x-full opacity-0"
    >
      <div
        id="toast-border"
        class="bg-white border-l-4 rounded-r-xl shadow-2xl p-6 flex items-start gap-4 min-w-[320px]"
      >
        <div id="toast-icon" class="mt-1"></div>
        <div class="flex-1">
          <h4 id="toast-title" class="font-bold text-gray-900 mb-1">
            Notifikasi
          </h4>
          <p id="toast-message" class="text-sm text-gray-600 leading-relaxed">
            ...
          </p>
        </div>
      </div>
    </div>

    <script type="module" src="./payment.js"></script>
  </body>
</html>
