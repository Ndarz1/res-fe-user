<section
  id="spotlight"
  class="relative w-full overflow-hidden bg-slate-900 text-white border-t border-white/5"
>
  <div
    id="spotlight-slider"
    class="flex transition-transform duration-1000 h-[600px] md:h-[650px]"
  ></div>

  <div
    class="absolute bottom-0 left-0 w-full md:w-1/2 p-6 md:p-12 z-20 flex flex-col gap-4 bg-gradient-to-t from-slate-900 via-slate-900/50 to-transparent md:bg-none"
  >
    <div class="flex items-center gap-4 w-full max-w-xs">
      <span id="current-slide" class="text-3xl font-serif italic text-white"
        >01</span
      >
      <div class="relative h-[1px] bg-white/20 flex-grow">
        <div
          id="progress-bar"
          class="absolute top-0 left-0 h-full bg-white w-0 transition-all duration-700 ease-out"
        ></div>
      </div>
      <span
        id="total-slides"
        class="text-sm font-sans tracking-widest text-white/40"
        >00</span
      >
    </div>

    <div class="flex items-center gap-3">
      <button
        id="prev-slide"
        class="group p-2.5 border border-white/10 rounded-full text-white/70 hover:bg-white hover:text-slate-900 transition-all duration-300 disabled:opacity-20"
      >
        <svg
          class="w-4 h-4 transition-transform group-hover:-translate-x-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M15 19l-7-7 7-7"
          ></path>
        </svg>
      </button>
      <button
        id="next-slide"
        class="group p-2.5 border border-white/10 rounded-full text-white/70 hover:bg-white hover:text-slate-900 transition-all duration-300 disabled:opacity-20"
      >
        <svg
          class="w-4 h-4 transition-transform group-hover:translate-x-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</section>
