<section
  id="spotlight"
  class="relative w-full overflow-hidden font-sans bg-gray-900"
>
  <div
    id="spotlight-slider"
    class="flex transition-transform duration-700 ease-in-out h-[600px] md:h-[700px]"
  ></div>

  <div
    class="absolute bottom-8 left-8 md:left-16 flex items-center justify-between w-[calc(100%-4rem)] md:w-5/12 pr-8 md:pr-16 z-20"
  >
    <div class="flex items-center gap-4 flex-grow">
      <span id="current-slide" class="text-3xl font-bold text-white">01</span>
      <div
        class="relative h-1 bg-white/20 flex-grow rounded-full overflow-hidden"
      >
        <div
          id="progress-bar"
          class="absolute top-0 left-0 h-full bg-white w-0 transition-all duration-700"
        ></div>
      </div>
      <span id="total-slides" class="text-sm font-medium text-white/60"
        >00</span
      >
    </div>

    <div class="flex items-center gap-2 ml-8">
      <button
        id="prev-slide"
        class="p-3 border border-white/30 rounded-full text-white hover:bg-white hover:text-gray-900 transition-all disabled:opacity-30 disabled:cursor-not-allowed"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 19l-7-7 7-7"
          ></path>
        </svg>
      </button>
      <button
        id="next-slide"
        class="p-3 border border-white/30 rounded-full text-white hover:bg-white hover:text-gray-900 transition-all disabled:opacity-30 disabled:cursor-not-allowed"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</section>
