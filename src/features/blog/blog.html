<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jurnal & Inspirasi - Eksplora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: "Playfair Display", serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900"
  >
    <div
      id="navbar-placeholder"
      class="fixed top-0 w-full z-50 transition-all duration-300"
    ></div>

    <header class="relative pt-32 pb-20 bg-slate-900 overflow-hidden">
      <div
        class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"
      ></div>
      <div
        class="absolute bottom-0 left-0 right-0 h-24 bg-gradient-to-t from-slate-50 to-transparent"
      ></div>
      <div class="container mx-auto px-6 relative z-10 text-center">
        <span
          class="inline-block py-1 px-3 rounded-full bg-blue-500/20 border border-blue-400/30 text-blue-300 text-xs font-bold tracking-widest uppercase mb-4 backdrop-blur-sm"
        >
          Eksplora Journal
        </span>
        <h1
          class="text-4xl md:text-6xl font-bold text-white mb-6 leading-tight"
        >
          Temukan Inspirasi <br /><span
            class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400"
            >Petualanganmu</span
          >
        </h1>
        <p class="text-slate-400 text-lg max-w-2xl mx-auto mb-10 font-light">
          Kumpulan cerita, tips perjalanan, dan rekomendasi destinasi
          tersembunyi untuk liburan yang tak terlupakan.
        </p>

        <div class="max-w-xl mx-auto relative group">
          <div
            class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-emerald-600 rounded-full opacity-25 group-hover:opacity-50 blur transition duration-1000 group-hover:duration-200"
          ></div>
          <div
            class="relative flex items-center bg-white rounded-full p-2 shadow-xl"
          >
            <svg
              class="w-6 h-6 text-slate-400 ml-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Cari artikel inspiratif..."
              class="w-full px-4 py-2 text-slate-700 focus:outline-none bg-transparent placeholder-slate-400"
            />
            <button
              id="search-btn"
              class="bg-slate-900 text-white px-6 py-2.5 rounded-full font-medium text-sm hover:bg-blue-600 transition-colors duration-300"
            >
              Cari
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="container mx-auto px-6 py-12 -mt-10 relative z-20">
      <div
        id="categories-container"
        class="flex flex-wrap justify-center gap-3 mb-12"
      ></div>

      <div
        id="blog-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
      ></div>

      <div id="empty-state" class="hidden text-center py-20">
        <svg
          class="w-16 h-16 text-slate-300 mx-auto mb-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
          ></path>
        </svg>
        <p class="text-slate-500 text-lg">Belum ada artikel yang ditemukan.</p>
      </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-12 mt-20">
      <div class="container mx-auto px-6 text-center">
        <p class="text-slate-500 text-sm">
          © 2024 Eksplora. All rights reserved.
        </p>
      </div>
    </footer>

    <script type="module" src="./blog.js"></script>
  </body>
</html>
