<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Membaca Artikel - Eksplora</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      .serif {
        font-family: "Playfair Display", serif;
      }
    </style>
  </head>
  <body class="bg-white text-slate-800 antialiased">
    <div class="container mx-auto px-6 pt-12 max-w-4xl">
      <a
        href="blog.html"
        class="inline-flex items-center gap-3 px-5 py-2.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-900 hover:text-white transition-all duration-300 group shadow-sm"
      >
        <svg
          class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          ></path>
        </svg>
        <span class="text-sm font-bold tracking-wide">Kembali ke Jurnal</span>
      </a>
    </div>

    <article class="pt-10 pb-20">
      <header class="container mx-auto px-6 max-w-4xl text-center mb-12">
        <div
          id="meta-container"
          class="flex items-center justify-center gap-4 text-sm text-slate-500 mb-6 animate-pulse"
        >
          <div class="h-4 w-24 bg-slate-200 rounded"></div>
        </div>
        <h1
          id="post-title"
          class="text-4xl md:text-5xl lg:text-6xl font-bold text-slate-900 leading-tight mb-8"
        >
          <div
            class="h-12 w-3/4 bg-slate-200 rounded mx-auto animate-pulse"
          ></div>
        </h1>
        <div
          class="w-full h-[400px] md:h-[500px] bg-slate-100 rounded-3xl overflow-hidden relative shadow-2xl"
        >
          <img
            id="post-image"
            class="w-full h-full object-cover"
            src=""
            alt=""
            style="display: none"
          />
          <div
            class="absolute inset-0 bg-gradient-to-t from-slate-900/50 to-transparent"
          ></div>
        </div>
      </header>

      <div
        class="container mx-auto px-6 max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-12"
      >
        <div class="lg:col-span-8">
          <div
            id="post-content"
            class="prose prose-lg prose-slate max-w-none prose-headings:font-serif prose-a:text-blue-600 prose-img:rounded-2xl"
          >
            <div class="space-y-4 animate-pulse">
              <div class="h-4 bg-slate-100 rounded w-full"></div>
              <div class="h-4 bg-slate-100 rounded w-5/6"></div>
              <div class="h-4 bg-slate-100 rounded w-4/6"></div>
            </div>
          </div>
        </div>

        <aside class="lg:col-span-4 space-y-8">
          <div
            id="related-wisata-wrapper"
            class="hidden bg-slate-50 p-6 rounded-3xl border border-slate-100 sticky top-10"
          >
            <div class="flex items-center gap-3 mb-6">
              <span
                class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                  ></path>
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                  ></path>
                </svg>
              </span>
              <div>
                <h3 class="font-bold text-slate-900">Rekomendasi Wisata</h3>
                <p class="text-xs text-slate-500">Terkait dengan artikel ini</p>
              </div>
            </div>

            <div id="related-wisata-container" class="space-y-4"></div>
          </div>
        </aside>
      </div>
    </article>

    <footer class="bg-white border-t border-slate-200 py-12 mt-20">
      <div class="container mx-auto px-6 text-center">
        <p class="text-slate-500 text-sm">
          © 2024 Eksplora. All rights reserved.
        </p>
      </div>
    </footer>

    <script type="module" src="./read.js"></script>
  </body>
</html>
