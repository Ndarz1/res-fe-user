<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Eksplora</title>
    <link href="../../css/output.css" rel="stylesheet" />
  </head>
  <body class="bg-white font-sans antialiased h-screen flex overflow-hidden">
    <div
      class="hidden lg:flex w-1/2 bg-gray-900 relative justify-center items-center"
    >
      <div
        class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073')] bg-cover bg-center opacity-60"
      ></div>
      <div class="relative z-10 text-center text-white px-12">
        <h2 class="text-5xl font-bold mb-6 tracking-tight">Jelajahi Dunia.</h2>
        <p class="text-xl text-gray-200 font-light">
          Masuk untuk mengelola pesanan Anda dan dapatkan penawaran eksklusif.
        </p>
      </div>
    </div>

    <div
      class="w-full lg:w-1/2 flex flex-col justify-center px-8 md:px-16 lg:px-24 py-12 overflow-y-auto"
    >
      <div class="max-w-md w-full mx-auto">
        <a
          href="/"
          class="inline-flex items-center gap-2 text-gray-500 hover:text-blue-600 mb-8 transition"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
          <span>Kembali ke Beranda</span>
        </a>

        <h1 class="text-3xl font-bold text-gray-900 mb-2">
          Selamat Datang Kembali
        </h1>
        <p class="text-gray-500 mb-8">Silakan masukkan detail akun Anda.</p>

        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Email</label
            >
            <input
              type="email"
              id="email"
              required
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
              placeholder="nama@email.com"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Password</label
            >
            <input
              type="password"
              id="password"
              required
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
              placeholder="••••••••"
            />
            <div class="flex justify-end mt-1">
              <a href="#" class="text-xs text-blue-600 hover:underline"
                >Lupa password?</a
              >
            </div>
          </div>

          <button
            type="submit"
            class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg shadow-blue-500/30"
          >
            Masuk
          </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500">
          Belum punya akun?
          <a
            href="register.html"
            class="text-blue-600 font-bold hover:underline"
            >Daftar Sekarang</a
          >
        </div>
      </div>
    </div>

    <script type="module" src="./auth.js"></script>
  </body>
</html>
